repository_type: pipeline

nf_core_version: 4.0.2

lint:
  files_unchanged:
    - docs/CONTRIBUTING.md
    - .prettierignore
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - .github/workflows/linting_comment.yml
    - .github/workflows/linting.yml
    - .github/.dockstore.yml
    - CODE_OF_CONDUCT.md
    - assets/nf-core-soma_logo_light.png
    - docs/images/nf-core-soma_logo_light.png
    - docs/images/nf-core-soma_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - LICENSE
    - .github/PULL_REQUEST_TEMPLATE.md
  nextflow_config: false
  nf_test_content: false
  multiqc_config:
    - report_comment
  files_exist:
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - nf-test.config
    - tests/default.nf.test
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/.dockstore.yml
    - docs/CONTRIBUTING.md
    - CODE_OF_CONDUCT.md
    - assets/nf-core-soma_logo_light.png
    - docs/images/nf-core-soma_logo_light.png
    - docs/images/nf-core-soma_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - LICENSE
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - conf/test.config
    - conf/test_full.config
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - .github/workflows/branch.yml
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - .github/workflows/linting_comment.yml
    - .github/workflows/linting.yml
  readme:
    - nextflow_badge
    - nfcore_template_badge
    - nextflow_badge

template:
  org: nf-core
  name: Soma
  description: 'Somatic Variant from FFPE '
  author: Dung
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - github
    - github_badges
    - license
    - ci
    - test_config
    - nf-test
    - igenomes
    - seqera_platform
    - gpu
    - codespaces
    - vscode
    - email
  is_nfcore: false
